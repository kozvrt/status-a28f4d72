<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>Bot HQ</title><style>
body{margin:0;font-family:system-ui;background:#0b0f1a;color:#e8ecff}h1{font-size:20px;margin:14px}
.g{display:flex;gap:10px;margin:0 12px}.gauge{flex:1;background:#151b2e;border-radius:14px;padding:10px;text-align:center}
.ring{--p:0;width:90px;height:90px;margin:auto;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#2a3150 0);display:grid;place-items:center;transition:--p 1s}
.ring b{background:#151b2e;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.bar{margin:10px 12px;padding:10px;background:#1d2440;border-radius:12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.c{background:#151b2e;border-radius:14px;padding:10px;text-align:center;border:2px solid #2a3150}
.av{font-size:34px;height:44px}.n{font-weight:700;font-size:13px}.s{font-size:12px;margin-top:4px}.h{font-size:10px;opacity:.6}
.active{border-color:#2ee59d}.active .av{animation:bounce .8s infinite}
.browser{border-color:#4da3ff;box-shadow:0 0 14px #4da3ff}.browser .av{animation:spin 2s linear infinite}
.sleeping{opacity:.75}.sleeping .av{animation:breathe 3s infinite}.unknown{opacity:.5}
.z{position:relative}.sleeping .z:after{content:"z z Z";position:absolute;right:-8px;top:-6px;font-size:12px;animation:float 2s infinite}
@keyframes bounce{50%{transform:translateY(-6px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(.9)}}@keyframes float{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
</style></head><body><h1>🤖 Bot HQ <span id=t style="font-size:12px;opacity:.6"></span></h1>
<div class=g><div class=gauge><div class=ring id=mr style="--c:#b36bff"><b id=mp>–</b></div><div id=mt>Memory</div></div><div class=gauge><div class=ring id=dr style="--c:#ffb84d"><b id=dp>–</b></div><div id=dt>Disk</div></div></div>
<div class=bar id=br>🌐 Browser: …</div><div class=grid id=g></div>
<p style="font-size:11px;opacity:.6;margin:12px">Status is read passively from the box (no bot reports): 🌐 from the shared browser-queue line; ⚡ active = bot's work folder changed in last 15 min; 💤 = no changes 15+ min; ❔ = no folder to watch. Box publishes about every 60s; page checks every 30s.</p>
<script>
const G=v=>(v/1073741824).toFixed(1)+'G';const IC={active:'⚡',browser:'🌐',sleeping:'💤',unknown:'❔'},LB={active:'ACTIVE',browser:'ON BROWSER',sleeping:'SLEEPING',unknown:'UNKNOWN'};
async function r(){try{const d=await (await fetch('https://raw.githubusercontent.com/kozvrt/status-a28f4d72/main/status.json?t='+Date.now(),{cache:'no-store'})).json();
const mp=Math.round(d.mem.used/d.mem.total*100),dp=Math.round(d.disk.used/d.disk.total*100);
mr.style.setProperty('--p',mp);dr.style.setProperty('--p',dp);window.mp.textContent=mp+'%';window.dp.textContent=dp+'%';
mt.textContent=`RAM ${(d.mem.used/1024).toFixed(1)}G used · ${(d.mem.avail/1024).toFixed(1)}G free`;dt.textContent=`Disk ${G(d.disk.used)} used · ${G(d.disk.avail)} free`;
br.textContent=`🌐 Browser queue: ${d.browserline} · ${d.chrome} Chrome processes running`;
t.textContent='updated '+new Date(d.ts*1000).toLocaleTimeString();
g.innerHTML=d.bots.map(b=>`<div class="c ${b.status}"><div class=av><span class=z>${IC[b.status]}</span></div><div class=n>${b.name}</div><div class=s>${LB[b.status]}</div><div class=h>${b.last?'last file change '+new Date(b.last*1000).toLocaleTimeString():''}<br>${b.how}</div></div>`).join('')}catch(e){br.textContent='⚠️ offline, retrying…'}}
r();setInterval(r,30000)</script></body></html>
